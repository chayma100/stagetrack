# Blueprint Render : crée la base PostgreSQL et le service web (Docker) en un clic.
# Render > New > Blueprint > choisir le dépôt GitHub.
databases:
  - name: stagetrack-db
    databaseName: stagetrack
    user: stagetrack
    plan: free
    region: frankfurt

services:
  - type: web
    name: stagetrack
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: stagetrack-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: stagetrack-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: stagetrack-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: stagetrack-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: stagetrack-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@stagetrack.local
      - key: ADMIN_PASSWORD
        sync: false          # à saisir dans le tableau de bord Render
      - key: SEED_DEMO
        value: "true"        # entreprises, offres et comptes de démonstration
