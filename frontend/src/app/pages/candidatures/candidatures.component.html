<div class="header bg-gradient-primary pb-8 pt-5 pt-md-8"></div>
<div class="container-fluid mt--7">
  <div class="row">
    <div class="col">
      <div class="card shadow">
        <div class="card-header border-0">
          <div class="row align-items-center">
            <div class="col"><h3 class="mb-0">Candidatures reçues</h3></div>
            <div class="col-auto">
              <button class="btn btn-sm btn-outline-primary" type="button" *ngIf="auth.isAdmin()" (click)="exportCsv()">Exporter en CSV</button>
            </div>
          </div>
          <div class="form-inline mt-3">
            <select class="form-control form-control-sm" name="statutFilter" [(ngModel)]="statutFilter" (ngModelChange)="onFilter()">
              <option value="">Tous les statuts</option>
              <option *ngFor="let s of statuts" [value]="s">{{ labels[s] }}</option>
            </select>
          </div>
        </div>
        <div class="alert alert-danger mx-4" *ngIf="error">{{ error }}</div>
        <div class="alert alert-success mx-4" *ngIf="info">{{ info }}</div>
        <div class="table-responsive">
          <table class="table align-items-center table-flush">
            <thead class="thead-light">
              <tr><th>Candidat</th><th>Offre</th><th>Entreprise</th><th>Envoyée le</th><th>CV</th><th>Statut</th><th>Changer le statut</th></tr>
            </thead>
            <tbody>
              <tr *ngFor="let c of candidatures">
                <td>{{ c.userNom }}<br><small class="text-muted">{{ c.userEmail }}</small></td>
                <td><a [routerLink]="['/offres', c.offreId]">{{ c.offreLibelle }}</a></td>
                <td>{{ c.entrepriseNom }}</td>
                <td>{{ c.dateEnvoi | date: 'dd/MM/yyyy' }}</td>
                <td>
                  <a *ngIf="c.cvNom; else noCv" href="javascript:void(0)" (click)="telechargerCv(c)">Télécharger le CV</a>
                  <ng-template #noCv><span class="text-muted">Aucun CV</span></ng-template>
                </td>
                <td><span class="badge" [ngClass]="badge(c.statut)">{{ labels[c.statut] }}</span></td>
                <td>
                  <select class="form-control form-control-sm" [ngModel]="c.statut" (ngModelChange)="changeStatut(c, $event)"
                          [name]="'statut' + c.id">
                    <option *ngFor="let s of statuts" [value]="s">{{ labels[s] }}</option>
                  </select>
                </td>
              </tr>
              <tr *ngIf="!loading && candidatures.length === 0">
                <td colspan="7" class="text-muted text-center py-4">Aucune candidature</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="card-footer py-4 d-flex justify-content-end" *ngIf="total > size">
          <ngb-pagination [collectionSize]="total" [pageSize]="size" [page]="pageNumber" [maxSize]="5"
                          [boundaryLinks]="true" (pageChange)="onPage($event)"></ngb-pagination>
        </div>
      </div>
    </div>
  </div>
</div>
