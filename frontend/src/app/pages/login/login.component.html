<div class="header bg-gradient-primary py-7 py-lg-8">
  <div class="container">
    <div class="header-body text-center mb-7">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-6">
          <h1 class="text-white">Bienvenue sur StageTrack</h1>
          <p class="text-lead text-light">Entreprises, offres de stage et candidatures au même endroit.</p>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="container mt--8 pb-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="card bg-secondary shadow border-0">
        <div class="card-body px-lg-5 py-lg-5">
          <div class="text-center text-muted mb-4"><small>Connectez-vous avec votre compte</small></div>
          <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
          <form role="form" (ngSubmit)="submit()" #f="ngForm">
            <div class="form-group mb-3">
              <div class="input-group input-group-alternative">
                <div class="input-group-prepend"><span class="input-group-text"><i class="ni ni-email-83"></i></span></div>
                <input class="form-control" placeholder="Email" type="email" name="email" [(ngModel)]="email" required>
              </div>
            </div>
            <div class="form-group">
              <div class="input-group input-group-alternative">
                <div class="input-group-prepend"><span class="input-group-text"><i class="ni ni-lock-circle-open"></i></span></div>
                <input class="form-control" placeholder="Mot de passe" type="password" name="password" [(ngModel)]="password" required>
              </div>
            </div>
            <div class="text-center">
              <button type="submit" class="btn btn-primary my-4" [disabled]="f.invalid || loading">
                {{ loading ? 'Connexion…' : 'Se connecter' }}
              </button>
            </div>
          </form>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-12 text-center">
          <a [routerLink]="['/choix-profil']" class="text-light"><small>Créer un compte</small></a>
        </div>
      </div>
    </div>
  </div>
</div>
