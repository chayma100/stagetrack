# Profil de production (Render) : PostgreSQL
# Deux façons de configurer la base :
#  - SPRING_DATASOURCE_URL (au format jdbc:postgresql://HOTE:5432/NOM_BASE) + USERNAME + PASSWORD
#  - ou DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD (fournis automatiquement par render.yaml)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stagetrack}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# En production, Angular est servi par Spring Boot (même origine) : pas de CORS à ouvrir.
