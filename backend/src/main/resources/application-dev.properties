# Profil de développement : MySQL local
# Modifier DB_PASSWORD (ou la variable d'environnement) selon votre installation MySQL.
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3307}/stagetrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.seed-demo=${SEED_DEMO:true}
