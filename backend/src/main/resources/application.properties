spring.application.name=stagetrack
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# --- JWT (en production : définir JWT_SECRET, 32 caractères minimum) ---
app.jwt.secret=${JWT_SECRET:change-me-please-use-a-long-random-secret-of-at-least-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Compte admin créé au premier démarrage + destinataire de l'email d'inscription ---
app.admin.email=${ADMIN_EMAIL:admin@stagetrack.local}
app.admin.password=${ADMIN_PASSWORD:Admin123!}

# --- CORS (utile seulement quand Angular tourne séparément sur le port 4200) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Données de démonstration (entreprises et offres) ---
app.seed-demo=${SEED_DEMO:false}

# --- Email : par défaut un serveur de test local (Mailpit / MailHog sur le port 1025) ---
# Si le serveur SMTP est injoignable, l'inscription réussit quand même et l'erreur est journalisée.
app.mail.from=${MAIL_FROM:no-reply@stagetrack.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
